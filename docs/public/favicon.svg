<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="X-Locality">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A78D6"/>
      <stop offset="1" stop-color="#6FA0F5"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- globe silhouette, kept faint so it reads as texture behind the
       monogram rather than competing with it -->
  <g stroke="#ffffff" stroke-opacity="0.25" fill="none" stroke-width="1.1">
    <circle cx="32" cy="31" r="18.5"/>
    <ellipse cx="32" cy="31" rx="6.5" ry="18.5"/>
    <path d="M13.5 31 H50.5"/>
  </g>

  <text x="32" y="39" text-anchor="middle"
        font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="25" letter-spacing="-0.5"
        fill="#ffffff">XL</text>
</svg>
