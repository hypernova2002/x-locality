name: Release

# Builds and publishes the backend and frontend production images to GHCR
# whenever a semver tag (e.g. v1.2.3) is pushed. Assumes the tagged commit
# has already gone through CI on main - this doesn't re-run the test suite,
# only builds and publishes.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            short_description: "Hanami/Ruby API for XLocality, a self-hosted LLM translation platform."
          - image: frontend
            context: frontend
            short_description: "Vue 3 admin UI for XLocality, a self-hosted LLM translation platform."
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repo secrets
      # (Settings -> Secrets and variables -> Actions). The token should be
      # a Docker Hub access token (Account Settings -> Security), not your
      # account password.
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile.production
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}-${{ matrix.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.repo }}-${{ matrix.image }}:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/x-locality-${{ matrix.image }}:${{ steps.meta.outputs.version }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/x-locality-${{ matrix.image }}:latest

      # Syncs the Docker Hub repo's overview page (description + full
      # README) from the file committed alongside each Dockerfile, so it
      # stays current every release instead of drifting from a manually
      # edited web-UI copy. continue-on-error: this needs a Docker Hub
      # token with read/write/delete scope specifically - read/write
      # (enough for the image push above) isn't enough for it. A sync
      # failure here shouldn't fail the actual image release.
      - uses: peter-evans/dockerhub-description@v5
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/x-locality-${{ matrix.image }}
          short-description: ${{ matrix.short_description }}
          readme-filepath: ./${{ matrix.context }}/DOCKERHUB.md
