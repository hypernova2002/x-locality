<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/xlocality-logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLocality</title>
    <script>
      // Applied before Vue mounts, so there's no flash of the wrong theme
      // while the app boots.
      (function () {
        var stored = localStorage.getItem('x-locality:theme')
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('p-dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
