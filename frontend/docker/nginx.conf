server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA - Vue Router uses history mode, so any path that isn't a real
    # file falls back to index.html and the client-side router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve a stale cached copy of the runtime config or the HTML
    # shell that references it; hashed assets under /assets/ are safe to
    # cache aggressively since a new build gets new filenames.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
