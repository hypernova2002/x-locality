services:
  postgres:
    image: postgres:16
    environment:
      TZ: UTC
      POSTGRES_DB: x_locality_development
      POSTGRES_USER: x_locality
      POSTGRES_PASSWORD: development_only_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x_locality -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025" # web UI - view sent budget-alert emails at http://localhost:8025

  api:
    build: ./backend
    command: bundle exec hanami server
    ports:
      - "2300:2300"
    volumes:
      - ./backend:/app
      - api_bundle:/usr/local/bundle
    environment:
      TZ: UTC
      HANAMI_ENV: development
      HANAMI_PORT: "2300"
      DATABASE_URL: postgres://x_locality:development_only_password@postgres:5432/x_locality_development
      SIDEKIQ_REDIS_URL: redis://redis:6379/0
      RACK_ATTACK_REDIS_URL: redis://redis:6379/1
      JWT_SECRET: development_only_secret_change_me
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # 32 random bytes, base64-encoded - e.g. `openssl rand -base64 32`.
      # Encrypts project-level LLM API keys at rest.
      ENCRYPTION_KEY: replace-with-a-base64-encoded-32-byte-key
      # Points at the mailhog dev container - swap for a real SMTP
      # provider's host/port/from address in production.
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAIL_FROM: alerts@x-locality.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: bundle exec sidekiq -r ./config/boot.rb
    volumes:
      - ./backend:/app
      - api_bundle:/usr/local/bundle
    environment:
      TZ: UTC
      HANAMI_ENV: development
      DATABASE_URL: postgres://x_locality:development_only_password@postgres:5432/x_locality_development
      SIDEKIQ_REDIS_URL: redis://redis:6379/0
      RACK_ATTACK_REDIS_URL: redis://redis:6379/1
      JWT_SECRET: development_only_secret_change_me
      ENCRYPTION_KEY: replace-with-a-base64-encoded-32-byte-key
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAIL_FROM: alerts@x-locality.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Browser-side, so this must be reachable from the host, not the
      # container network - the api service name won't resolve in-browser.
      VITE_API_BASE_URL: http://localhost:2300

  docs:
    build: ./docs
    ports:
      - "5174:5174" # user guide (VitePress) - http://localhost:5174
    volumes:
      - ./docs:/app
      - docs_node_modules:/app/node_modules

volumes:
  postgres_data:
  redis_data:
  api_bundle:
  frontend_node_modules:
  docs_node_modules:
